name: hanbova_app
description: "Hanbova - Send protected. Africa-first Bitcoin payment application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  flutter_secure_storage: ^9.0.0
  http: ^1.2.0
  intl: ^0.20.2
  uuid: ^4.3.3
  qr_flutter: ^4.1.0
  local_auth: ^2.3.0
  cryptography: ^2.7.0
  pointycastle: ^3.7.4
  ffi: ^2.1.3
  path_provider: ^2.1.5
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/v4/
    - assets/brand/v4/logo/
    - assets/brand/v4/onboarding/
    - assets/brand/v4/splash/
    - assets/branding/
    - assets/branding/onboarding/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
